# Oportunidades CEFET — produção / homologação.
#
#   cp .env.example .env      # preencha senhas e o segredo do JWT
#   docker compose up -d --build
#
# Só o frontend (nginx) fica exposto, na porta APP_PORT do .env. Ele entrega o app e
# repassa /api ao backend. Backend e MongoDB ficam acessíveis apenas na rede interna.
# Desenvolvimento com hot reload: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Os containers não têm nome fixo: o Compose usa o nome da pasta (ex.: oportunidadescefet-backend-1),
# então dá para rodar mais de uma cópia no mesmo servidor (ex.: homologação e produção em pastas
# diferentes, cada uma com seu APP_PORT). Use sempre os nomes dos serviços: docker compose logs backend.

services:

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?defina MONGO_INITDB_ROOT_USERNAME no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?defina MONGO_INITDB_ROOT_PASSWORD no .env}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-oportunidades_cefet}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE:-oportunidades_cefet}?authSource=admin
      SPRING_DATA_MONGODB_DATABASE: ${MONGO_INITDB_DATABASE:-oportunidades_cefet}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?defina SECURITY_JWT_SECRET no .env}
      SECURITY_JWT_EXPIRATION_MS: ${SECURITY_JWT_EXPIRATION_MS:-86400000}
      SECURITY_JWT_REFRESH_EXPIRATION_MS: ${SECURITY_JWT_REFRESH_EXPIRATION_MS:-604800000}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-*}
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-INFO}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # A imagem do JRE não tem curl: testa se a porta 8080 já aceita conexão.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Interface web do MongoDB, só quando pedida: docker compose --profile tools up -d
  # Fica presa ao localhost do servidor (use um túnel SSH para acessar de fora).
  mongo-express:
    image: mongo-express
    profiles:
      - tools
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  mongo-data:
