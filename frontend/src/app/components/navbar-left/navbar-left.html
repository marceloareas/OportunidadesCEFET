<aside class="sidebar-left">
  <nav class="menu-esquerda" aria-label="Menu principal">
    <div class="item-list">
      @if (usuarioId) {
        <a [routerLink]="['/perfil', usuarioId]" routerLinkActive="ativo" ariaCurrentWhenActive="page">
          <i class="bi bi-person-circle" aria-hidden="true"></i><span>Editar Perfil</span>
        </a>
      }

      <span class="divisor" role="separator"></span>

      <a routerLink="/home" routerLinkActive="ativo" ariaCurrentWhenActive="page">
        <i class="bi bi-house" aria-hidden="true"></i><span>Página inicial</span>
      </a>

      <a routerLink="/minhas_discussoes" routerLinkActive="ativo" ariaCurrentWhenActive="page">
        <i class="bi bi-chat-left-text" aria-hidden="true"></i><span>Minhas Discussões</span>
      </a>

      <a routerLink="/oportunidades" routerLinkActive="ativo" ariaCurrentWhenActive="page">
        <i class="bi bi-briefcase" aria-hidden="true"></i><span>Oportunidades</span>
      </a>

      <a routerLink="/itens_salvos" routerLinkActive="ativo" ariaCurrentWhenActive="page">
        <i class="bi bi-bookmark" aria-hidden="true"></i><span>Itens Salvos</span>
      </a>

      <span class="divisor" role="separator"></span>
    </div>
  </nav>
</aside>
