<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">{{ data.cancelLabel || 'Cancelar' }}</button>
  <button mat-raised-button color="primary" (click)="confirmar()">{{ data.confirmLabel || 'Confirmar' }}</button>
</mat-dialog-actions>
